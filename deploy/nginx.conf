server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable the JS Self-Profiling API (new Profiler(...)) — required for the
    # perf-kit's "Profile 10s" button.
    add_header Document-Policy "js-profiling" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # Long-cache hashed assets; HTML stays revalidated so redeploys take effect.
    # nginx quirk: any add_header inside a location resets inherited headers, so
    # every location that has its own add_header must repeat Document-Policy.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|wasm)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Document-Policy "js-profiling" always;
        try_files $uri =404;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        add_header Document-Policy "js-profiling" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
